---
# playbook.yml
#
# Installs the standard toolset (per-OS package manager), a handful of
# global npm packages via nvm, and applies chezmoi dotfiles from
# Geekiac/dotfiles. Safe to re-run — every task is state-checking, not
# action-repeating.
#
# Requires:
#   - community.general collection (bundled with `ansible`, the PyPI
#     meta-package — already the case if installed via
#     `uv tool install ansible` rather than the bare `ansible-core`).
#   - kewlfft.aur collection, for installing AUR packages via yay.
#     NOT bundled by default — install once with:
#       uv tool run --from ansible ansible-galaxy collection install kewlfft.aur
#
# First Arch run must be interactive: building yay via makepkg calls
# `sudo` internally partway through (separate from Ansible's own
# --ask-become-pass), so it'll pause for your password mid-build the
# first time only, same pattern as the Xcode CLT step on macOS.
#
# Run with:
#   uv tool run --from ansible ansible-playbook playbook.yml --ask-become-pass

- name: Bootstrap standard toolset
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    dotfiles_repo: "Geekiac/dotfiles"

    # macOS — Homebrew formulae (CLI tools) vs casks (GUI apps / fonts)
    # are two different install mechanisms, so they're split here.
    homebrew_formulae:
      - bat
      - btop
      - chezmoi
      - emacs
      - eza
      - fastfetch
      - fd
      - fortune
      - fzf
      - git
      - herdr
      - htop
      - lazygit
      - mas
      - nvm
      - ollama
      - ripgrep
      - neovim
      - starship
      - tlrc
      - tmux
      - tree-sitter-cli
      - wget
      - yazi
      - zoxide

    # macOS — Mac App Store apps, installed via mas. IDs come from
    # `mas search "<name>"`. mas can only install apps already tied to
    # the signed-in Apple ID (bought/gotten at least once) — on a fresh
    # machine with no App Store account signed in yet, sign in via the
    # App Store app's GUI first, then re-run.
    mac_app_store_apps:
      "Wipr 2": 1662217862
      "WhatsApp Messenger": 310633997

    homebrew_casks:
      - discord
      - ghostty
      - font-fira-code-nerd-font
      - google-chrome
      - obsidian
      - steam
      - visual-studio-code

    # Arch — official-repo packages, via pacman. Two names differ from
    # what you'd guess: fortune is "fortune-mod", and the Fira Code Nerd
    # Font is "ttf-firacode-nerd" (post-v3 nerd-fonts split naming).
    # steam needs the multilib repo enabled — see the task below that
    # does it. VS Code isn't here — it's AUR-only for the MS-branded
    # build, see aur_packages below.
    pacman_packages:
      - bash-completion
      - bat
      - btop
      - chezmoi
      - discord
      - emacs
      - ghostty
      - eza
      - fastfetch
      - fd
      - fortune-mod
      - fzf
      - git
      - htop
      - lazygit
      - neovim
      - nvm
      - ollama
      - ripgrep
      - starship
      - steam
      - tmux
      - tree-sitter-cli
      - ttf-firacode-nerd
      - wget
      - yazi
      - zoxide

    # Arch — AUR packages, via yay (bootstrapped below if missing).
    # visual-studio-code-bin is the MS-branded build (Marketplace access,
    # matches the Homebrew cask) rather than the official repo's "code"
    # (open-source vscode-oss build, Open VSX only). obsidian isn't in
    # the official repos at all, only the AUR. herdr-bin is the
    # prebuilt-binary AUR package (vs. the source-building "herdr"
    # package) — same "-bin" preference as visual-studio-code-bin. Unlike
    # the Homebrew formula, it installs only the binary with no shell
    # completions, so dot_bashrc sources `herdr completion bash` itself.
    aur_packages:
      - google-chrome
      - herdr-bin
      - obsidian
      - tlrc
      - visual-studio-code-bin

    # Global npm packages, installed under nvm's managed Node rather than
    # any system npm. Assumes nvm is already installed (see
    # homebrew_formulae/pacman_packages above) — this playbook doesn't
    # install nvm/Node itself, only bumps nvm's default alias if it's too
    # old for these packages (see nvm_min_node_major below). pi's package
    # is scoped under @earendil-works, not @mariozechner (the old scope
    # is deprecated upstream); npm_install_args is empty except where a
    # package's own install docs ask for a flag — pi's quickstart
    # (https://pi.dev/docs/latest/quickstart) says to pass
    # --ignore-scripts since it doesn't need install-time scripts.
    npm_global_packages:
      - name: opencode-ai
        npm_install_args: ""
      - name: "@earendil-works/pi-coding-agent"
        npm_install_args: "--ignore-scripts"

    # Floor for nvm's default-aliased Node version, checked before
    # installing npm_global_packages above. @earendil-works/pi-coding-agent
    # needs Node >=22.19.0 (`npm view @earendil-works/pi-coding-agent
    # engines`) — a stale default (e.g. an old "nvm alias default 18"
    # from long ago) fails at runtime with "Invalid regular expression
    # flags" rather than at install time, since npm doesn't enforce
    # `engines`.
    nvm_min_node_major: 22

  tasks:
    # -------------------------------------------------------------------
    # macOS
    #
    # Using ansible.builtin.command rather than community.general.homebrew
    # /homebrew_cask deliberately: those modules parse brew's own output
    # text to judge success/failure, and misreport routine "already
    # installed" notices as failures against current Homebrew's output
    # format. Trusting the exit code instead is more reliable — same
    # reasoning as the chezmoi apply task below.
    # -------------------------------------------------------------------
    - name: Install Homebrew formulae
      ansible.builtin.command:
        cmd: "brew install {{ item }}"
      loop: "{{ homebrew_formulae }}"
      register: brew_formula_result
      changed_when: "'already installed' not in (brew_formula_result.stdout + brew_formula_result.stderr)"
      failed_when: brew_formula_result.rc != 0
      when: ansible_facts['os_family'] == "Darwin"
      # Homebrew must NOT run as root — no become here.

    - name: Install Homebrew casks
      ansible.builtin.command:
        cmd: "brew install --cask {{ item }}"
      loop: "{{ homebrew_casks }}"
      register: brew_cask_result
      changed_when: "'already installed' not in (brew_cask_result.stdout + brew_cask_result.stderr)"
      failed_when: brew_cask_result.rc != 0
      when: ansible_facts['os_family'] == "Darwin"

    - name: Install Mac App Store apps
      ansible.builtin.command:
        cmd: "mas install {{ item }}"
      loop: "{{ mac_app_store_apps.values() | list }}"
      register: mas_result
      changed_when: "'Already installed' not in (mas_result.stdout + mas_result.stderr)"
      failed_when: mas_result.rc != 0
      when: ansible_facts['os_family'] == "Darwin"
      # community.general.mas parses `mas list` to check current state,
      # splitting each line on the first space — but mas right-aligns
      # shorter IDs with a leading space, which the naive split chokes
      # on ("invalid literal for int() with base 10: ''"). Same class of
      # output-parsing fragility as the Homebrew modules avoided above;
      # trusting `mas install`'s own exit code/stdout instead sidesteps it.

    # -------------------------------------------------------------------
    # `brew install ollama` only lays down the binary — it doesn't start
    # the server, so `ollama pull`/`ollama run` fail with "could not
    # connect to ollama server" until something runs `ollama serve`.
    # `brew services start` runs it as a launchd background service
    # (also restarts it at login) instead. Same command-module/exit-code
    # pattern as the brew tasks above: `brew services start` on an
    # already-running service prints "already started" and still exits 0.
    # -------------------------------------------------------------------
    - name: Start ollama service
      ansible.builtin.command:
        cmd: brew services start ollama
      register: ollama_service_result
      changed_when: "'already started' not in (ollama_service_result.stdout + ollama_service_result.stderr)"
      failed_when: ollama_service_result.rc != 0
      when: ansible_facts['os_family'] == "Darwin"

    # -------------------------------------------------------------------
    # nvm's working directory. Homebrew's nvm caveat says to create this
    # manually — the formula doesn't do it. Created unconditionally
    # (harmless on Arch too) rather than gating to macOS.
    # -------------------------------------------------------------------
    - name: Ensure nvm working directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.nvm"
        state: directory
        mode: "0755"

    # -------------------------------------------------------------------
    # Arch
    # -------------------------------------------------------------------
    # multilib is disabled by default on Arch and provides the 32-bit
    # libraries steam's runtime needs. Uncommenting it here is idempotent
    # (no-ops once already enabled); update_cache below then picks it up.
    - name: Enable multilib repository (required for steam)
      ansible.builtin.replace:
        path: /etc/pacman.conf
        regexp: '#\[multilib\]\n#Include = /etc/pacman\.d/mirrorlist'
        replace: "[multilib]\nInclude = /etc/pacman.d/mirrorlist"
      become: true
      when: ansible_facts['distribution'] == "Archlinux"

    - name: Install pacman packages
      community.general.pacman:
        name: "{{ pacman_packages }}"
        state: present
        update_cache: true
      become: true
      when: ansible_facts['distribution'] == "Archlinux"

    # -------------------------------------------------------------------
    # Arch's ollama package ships a systemd unit (ollama.service) but
    # doesn't enable it, same underlying issue as the Homebrew formula
    # above: the binary's present but nothing's listening on :11434
    # until the service is started.
    # -------------------------------------------------------------------
    - name: Enable and start ollama service
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
      become: true
      when: ansible_facts['distribution'] == "Archlinux"

    # -------------------------------------------------------------------
    # Arch — yay (AUR helper), bootstrapped from source if missing
    # -------------------------------------------------------------------
    - name: Check whether yay is already installed
      ansible.builtin.command: which yay
      register: yay_check
      changed_when: false
      failed_when: false
      when: ansible_facts['distribution'] == "Archlinux"

    - name: Install base-devel and git (required to build yay)
      community.general.pacman:
        name:
          - base-devel
          - git
        state: present
      become: true
      when:
        - ansible_facts['distribution'] == "Archlinux"
        - yay_check.rc != 0

    - name: Clone yay from the AUR
      ansible.builtin.git:
        repo: https://aur.archlinux.org/yay.git
        dest: /tmp/yay-build
      when:
        - ansible_facts['distribution'] == "Archlinux"
        - yay_check.rc != 0
      # No become: makepkg refuses to run as root.

    - name: Build and install yay
      ansible.builtin.command:
        cmd: makepkg -si --noconfirm
        chdir: /tmp/yay-build
      when:
        - ansible_facts['distribution'] == "Archlinux"
        - yay_check.rc != 0
      # makepkg calls sudo internally for the final package install —
      # that's the interactive pause mentioned at the top of this file.

    # -------------------------------------------------------------------
    # Arch — AUR packages via yay
    # -------------------------------------------------------------------
    - name: Install AUR packages via yay
      kewlfft.aur.aur:
        name: "{{ aur_packages }}"
        use: yay
        state: present
      when: ansible_facts['distribution'] == "Archlinux"
      # No become: AUR builds must not run as root, same as yay itself.

    # -------------------------------------------------------------------
    # Global npm packages — opencode, pi — via nvm-managed npm. OS-agnostic
    # (nvm works the same on both), so this isn't gated on os_family/
    # distribution, only on nvm actually being present. nvm's shell
    # functions (`nvm use`, `nvm which`) aren't available to Ansible's
    # non-interactive shell, so nvm's init script is sourced directly in
    # each command instead. Skipped (not failed) if that script can't be
    # found, since this playbook assumes nvm/Node are already installed
    # rather than installing them itself.
    #
    # ~/.nvm/nvm.sh is NOT a reliable check on macOS: Homebrew's nvm
    # formula doesn't create it at install time — it's a symlink that
    # $(brew --prefix nvm)/nvm.sh only creates lazily, the first time
    # something sources it (e.g. a real interactive shell via .zshrc).
    # On a fresh bootstrap, that means it's still missing when this
    # playbook runs, silently skipping this whole block. So this checks
    # every location nvm's init script could be (each OS's package puts
    # it somewhere different), not just the user's own $NVM_DIR.
    #
    # Mirrors the yay bootstrap pattern above: a check task (rc register,
    # failed_when: false) followed by an install task gated on rc != 0,
    # so changed_when: true only ever fires when an install actually ran.
    # No become: npm global installs under nvm must run as the normal
    # user, same reasoning as yay/chezmoi.
    # -------------------------------------------------------------------
    - name: Locate nvm's init script
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          for candidate in "$(brew --prefix nvm 2>/dev/null)/nvm.sh" "$HOME/.nvm/nvm.sh" "/usr/share/nvm/init-nvm.sh"; do
            [ -s "$candidate" ] && printf '%s' "$candidate" && break
          done
          true
      register: nvm_script
      changed_when: false
      failed_when: false

    # nvm's default alias can be stuck on an old Node major (e.g. a
    # long-ago "nvm alias default 18") that's too old for the packages
    # below. Only bumped when actually below the floor, so this doesn't
    # hit the network / re-run `nvm install` on an otherwise-unchanged
    # play. Must run before the install task below, since `npm install
    # -g` targets whatever `nvm use default` resolves to.
    - name: Check nvm default Node major version
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >
          source "{{ nvm_script.stdout }}" &&
          nvm version default | sed 's/^v//' | cut -d. -f1
      register: nvm_default_major
      changed_when: false
      failed_when: false
      when: nvm_script.stdout | length > 0

    - name: Install current LTS Node and set as nvm default
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >
          source "{{ nvm_script.stdout }}" &&
          nvm install --lts &&
          nvm alias default 'lts/*' &&
          nvm use default
      when:
        - nvm_script.stdout | length > 0
        - (nvm_default_major.stdout | default('0', true) | trim | int) < nvm_min_node_major
      changed_when: true

    - name: Check which npm global packages are already installed
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >
          source "{{ nvm_script.stdout }}" && nvm use default >/dev/null &&
          npm list -g --depth=0 {{ item.name }}
      loop: "{{ npm_global_packages }}"
      register: npm_global_check
      changed_when: false
      failed_when: false
      when: nvm_script.stdout | length > 0

    - name: Install global npm packages via nvm-managed npm
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: >
          source "{{ nvm_script.stdout }}" && nvm use default >/dev/null &&
          npm install -g {{ item.item.npm_install_args }} {{ item.item.name }}
      loop: "{{ npm_global_check.results | default([]) }}"
      when:
        - nvm_script.stdout | length > 0
        - item.rc != 0
      changed_when: true

    # -------------------------------------------------------------------
    # chezmoi — init once, apply every run
    # -------------------------------------------------------------------
    - name: Check whether chezmoi has already been initialized
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.local/share/chezmoi"
      register: chezmoi_source

    - name: Initialize chezmoi from dotfiles repo
      ansible.builtin.command:
        cmd: "chezmoi init {{ dotfiles_repo }}"
      when: not chezmoi_source.stat.exists
      changed_when: true

    - name: Apply chezmoi
      ansible.builtin.command:
        cmd: chezmoi apply --verbose
      register: chezmoi_apply
      changed_when: chezmoi_apply.stdout | trim != ""

    # -------------------------------------------------------------------
    # yazi plugins — installed from the chezmoi-managed package.toml
    # lockfile. `ya pkg install` is declarative/idempotent by design (it
    # "restores all plugins with versions locked in the configuration
    # file"), so — like chezmoi apply above — it's run unconditionally
    # every time rather than gated behind a stat check.
    # -------------------------------------------------------------------
    - name: Install yazi plugins
      ansible.builtin.command:
        cmd: ya pkg install
      changed_when: true

    # -------------------------------------------------------------------
    # Doom Emacs — cloned once, like yay above. This must run after
    # chezmoi apply: DOOMDIR (~/.config/doom) is chezmoi-managed, and
    # `doom install` only *creates* init.el/config.el/packages.el when
    # they're missing — it never overwrites them — so chezmoi's copies
    # need to already be in place before install runs, or it'll deploy
    # its own stock templates instead.
    #
    # `doom install` is itself idempotent/safe to reuse (it says so in
    # its own --help), but it also re-syncs packages every time, which
    # is slow for no benefit on a no-op run — so like the yay build
    # above, it's gated on the initial clone rather than run every time.
    # `--force` suppresses its interactive prompts (envvar file, etc.),
    # matching this playbook's otherwise-non-interactive package tasks.
    # -------------------------------------------------------------------
    - name: Check whether Doom Emacs is already cloned
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.config/emacs"
      register: doom_emacs_dir

    - name: Clone Doom Emacs
      ansible.builtin.git:
        repo: https://github.com/doomemacs/core
        dest: "{{ ansible_env.HOME }}/.config/emacs"
        depth: 1
      when: not doom_emacs_dir.stat.exists

    - name: Install Doom Emacs (deploys DOOMDIR, installs packages)
      ansible.builtin.command:
        cmd: "{{ ansible_env.HOME }}/.config/emacs/bin/doom install --force"
      when: not doom_emacs_dir.stat.exists
      changed_when: true
